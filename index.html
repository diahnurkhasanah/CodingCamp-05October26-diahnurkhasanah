<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Life Dashboard</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: ['attribute', '[data-theme="dark"]'],
      theme: {
        extend: {
          colors: { accent: '#5c6bc0' },
          backgroundImage: {
            'page-gradient': 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)',
          },
        },
      },
    };
  </script>

  <style>
    /* Timer finish animation */
    @keyframes timer-pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.45; }
    }
    .timer-display--finished { animation: timer-pulse 0.6s ease-in-out 3; }

    /* Classes injected by JS at runtime */
    .clock-error,
    .validation-error {
      color: #e53e3e;
      font-size: 0.875rem;
      margin-top: 4px;
    }
    .storage-warning-banner {
      position: sticky;
      top: 0;
      z-index: 200;
      padding: 12px 16px;
      background: #f6e05e;
      color: #744210;
      font-weight: 600;
      font-size: 0.9375rem;
      text-align: center;
    }

    /* Hide number input spinners */
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; }
    input[type=number] { -moz-appearance: textfield; }
  </style>

  <!-- Prevent FOUC: apply saved theme before first paint -->
  <script>
    (function () {
      var stored = localStorage.getItem('dashboard_theme');
      document.documentElement.setAttribute(
        'data-theme',
        ['light', 'dark'].indexOf(stored) !== -1 ? stored : 'light'
      );
    })();
  </script>
</head>

<body class="min-h-screen bg-page-gradient font-sans antialiased">

  <div class="max-w-4xl mx-auto px-4 py-6 flex flex-col gap-5">

    <!-- Clock & Greeting -->
    <header id="clock-container"
            class="bg-white dark:bg-[#1e2432] border border-gray-200 dark:border-gray-700
                   rounded-xl shadow-lg p-6 text-center">
      <div id="clock-time"
           class="text-5xl font-bold tracking-wide leading-none text-accent">
        --:--:--
      </div>
      <div id="clock-date"
           class="mt-1 text-sm text-gray-500 dark:text-gray-400"></div>
      <div id="greeting-container">
        <p id="greeting-text"
           class="mt-3 text-xl font-semibold text-gray-800 dark:text-gray-100">
          Good day
        </p>
      </div>
    </header>

    <!-- Timer + Tasks -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">

      <!-- Focus Timer -->
      <div id="timer-container"
           class="bg-white dark:bg-[#1e2432] border border-gray-200 dark:border-gray-700
                  rounded-xl shadow-lg p-6">
        <h2 class="mb-3 text-lg font-semibold text-gray-800 dark:text-gray-100">
          Focus Timer
        </h2>

        <div id="timer-display"
             class="mb-4 text-5xl font-bold tracking-widest text-center tabular-nums text-accent">
          25:00
        </div>

        <div id="timer-controls" class="flex flex-wrap justify-center gap-2">
          <button id="timer-start"
                  class="min-w-[72px] px-4 py-2 rounded-md bg-accent text-white
                         font-semibold cursor-pointer transition-opacity hover:opacity-85
                         focus-visible:outline focus-visible:outline-2 focus-visible:outline-accent">
            Start
          </button>
          <button id="timer-stop"
                  class="min-w-[72px] px-4 py-2 rounded-md bg-gray-500 text-white
                         font-semibold cursor-pointer transition-opacity hover:opacity-85
                         focus-visible:outline focus-visible:outline-2 focus-visible:outline-accent">
            Stop
          </button>
          <button id="timer-reset"
                  class="min-w-[72px] px-4 py-2 rounded-md bg-gray-500 text-white
                         font-semibold cursor-pointer transition-opacity hover:opacity-85
                         focus-visible:outline focus-visible:outline-2 focus-visible:outline-accent">
            Reset
          </button>
        </div>

        <div class="mt-4 flex items-center gap-2">
          <input type="number" id="timer-duration-input"
                 min="1" max="120" placeholder="1–120 min"
                 aria-label="Custom timer duration in minutes"
                 class="w-28 px-3 py-2 rounded-md border border-gray-300 dark:border-gray-600
                        bg-white dark:bg-[#1e2432] text-gray-800 dark:text-gray-100
                        focus:outline-none focus:border-accent transition-colors" />
          <button id="timer-duration-save" aria-label="Save duration"
                  class="px-4 py-2 rounded-md bg-gray-500 text-white font-semibold
                         cursor-pointer transition-opacity hover:opacity-85
                         focus-visible:outline focus-visible:outline-2 focus-visible:outline-accent">
            ✓
          </button>
        </div>

        <p id="timer-error" role="alert" class="validation-error hidden"></p>
        <p id="timer-complete-msg" role="alert"
           class="hidden mt-2 font-semibold text-accent">
          ✅ Session complete!
        </p>
      </div>

      <!-- Tasks -->
      <div id="tasks-container"
           class="bg-white dark:bg-[#1e2432] border border-gray-200 dark:border-gray-700
                  rounded-xl shadow-lg p-6">
        <h2 class="mb-3 text-lg font-semibold text-gray-800 dark:text-gray-100">
          Tasks
        </h2>

        <div class="flex gap-2">
          <input type="text" id="task-input"
                 placeholder="Add a task…" maxlength="200"
                 aria-label="New task description"
                 class="flex-1 px-3 py-2 rounded-md border border-gray-300 dark:border-gray-600
                        bg-white dark:bg-[#1e2432] text-gray-800 dark:text-gray-100
                        focus:outline-none focus:border-accent transition-colors" />
          <button id="task-add"
                  class="px-4 py-2 rounded-md bg-accent text-white font-semibold
                         cursor-pointer transition-opacity hover:opacity-85
                         focus-visible:outline focus-visible:outline-2 focus-visible:outline-accent">
            Add
          </button>
        </div>

        <p id="task-error" role="alert" class="validation-error hidden"></p>

        <div class="mt-2 flex items-center gap-2">
          <label for="task-sort"
                 class="text-sm text-gray-500 dark:text-gray-400">Sort:</label>
          <select id="task-sort" aria-label="Sort tasks"
                  class="px-2 py-1 text-sm rounded-md border border-gray-300 dark:border-gray-600
                         bg-white dark:bg-[#1e2432] text-gray-800 dark:text-gray-100
                         focus:outline-none focus:border-accent">
            <option value="creation">By Creation Date</option>
            <option value="active-first">Active First</option>
            <option value="completed-first">Completed First</option>
            <option value="alpha-asc">Alphabetical (A–Z)</option>
          </select>
        </div>

        <ul id="task-list" aria-label="Task list"
            class="task-list mt-3 flex flex-col gap-2"></ul>
      </div>
    </div>

    <!-- Quick Links -->
    <section id="links-container"
             class="bg-white dark:bg-[#1e2432] border border-gray-200 dark:border-gray-700
                    rounded-xl shadow-lg p-6">
      <h2 class="mb-3 text-lg font-semibold text-gray-800 dark:text-gray-100">
        Quick Links
      </h2>

      <div class="flex flex-wrap gap-2">
        <input type="text" id="link-label-input"
               placeholder="Link Name" maxlength="50"
               aria-label="Link label"
               class="w-40 px-3 py-2 rounded-md border border-gray-300 dark:border-gray-600
                      bg-white dark:bg-[#1e2432] text-gray-800 dark:text-gray-100
                      focus:outline-none focus:border-accent transition-colors" />
        <input type="url" id="link-url-input"
               placeholder="URL" maxlength="2048"
               aria-label="Link URL"
               class="w-80 px-3 py-2 rounded-md border border-gray-300 dark:border-gray-600
                      bg-white dark:bg-[#1e2432] text-gray-800 dark:text-gray-100
                      focus:outline-none focus:border-accent transition-colors" />
        <button id="link-add"
                class="px-4 py-2 rounded-md bg-accent text-white font-semibold
                       cursor-pointer transition-opacity hover:opacity-85
                       focus-visible:outline focus-visible:outline-2 focus-visible:outline-accent">
          Add Link
        </button>
      </div>

      <p id="link-error" role="alert" class="validation-error hidden"></p>
      <div id="links-list" aria-label="Quick links"
           class="quick-links-list mt-3 flex flex-wrap gap-2"></div>
    </section>

  </div>

  <!-- Theme toggle -->
  <button id="theme-toggle" type="button" aria-label="Switch to dark theme"
          class="fixed bottom-6 right-6 z-50 flex items-center justify-center
                 w-12 h-12 rounded-full text-2xl cursor-pointer
                 bg-white dark:bg-[#1e2432] border border-gray-200 dark:border-gray-700
                 shadow-lg transition-transform hover:scale-110 active:scale-95
                 focus-visible:outline focus-visible:outline-2 focus-visible:outline-accent">
    🌙
  </button>

  <script src="js/app.js"></script>
</body>
</html>
